name: stale

# Issue triage hygiene: an issue with no activity for 60 days is marked stale
# and closed 14 days later, unless it is accepted or high priority. The action
# is pinned to a commit SHA (resolved from actions/stale v11.0.0) so a moved
# tag cannot change what runs here.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            No activity for 60 days, so this is marked stale. Comment to keep it
            open; it closes in 14 days.
          close-issue-message: >
            Closed for inactivity. Reopen or file a new issue if it still applies.
          exempt-issue-labels: "priority: high,status: accepted,status: in-progress,status: blocked"
          operations-per-run: 100